<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redzai Guesthouse</title>
  <meta name="description" content="Redzai Guesthouse – book the whole house or a single room.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body class="landing">
  <main class="landing-grid">
    <section class="brand-side">
      <div class="brand-mark" aria-hidden="true">⌂</div>
      <p class="eyebrow">Selamat datang ke</p>
      <h1 class="business-name">
        <span class="name-main">Redzai</span>
        <span class="name-sub">Guesthouse</span>
      </h1>
      <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
      <p class="tagline">A homely stay for family and friends. Book the whole house, or just the room you need.</p>

      <ul class="units" id="units"></ul>

      <div class="cta">
        <a class="btn btn-primary" href="rooms.html">Check availability</a>
        <a class="btn btn-outline" href="login.html" id="signin-btn">Sign in</a>
      </div>
      <p class="new-guest" id="new-guest">New guest? <a href="login.html?tab=register">Create an account</a></p>
    </section>

    <aside class="art-side" aria-hidden="true">
      <svg class="pattern" width="100%" height="100%">
        <defs>
          <pattern id="songket" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M24 2 L46 24 L24 46 L2 24 Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <path d="M24 14 L34 24 L24 34 L14 24 Z" fill="currentColor" opacity=".55"/>
            <circle cx="0" cy="0" r="2.5" fill="currentColor"/>
            <circle cx="48" cy="0" r="2.5" fill="currentColor"/>
            <circle cx="0" cy="48" r="2.5" fill="currentColor"/>
            <circle cx="48" cy="48" r="2.5" fill="currentColor"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#songket)"/>
      </svg>

      <div class="sun"></div>

      <svg class="house" viewBox="0 0 400 360">
        <!-- leaves -->
        <path class="leaf" d="M18 330 C 10 260, 40 210, 70 190 C 60 240, 50 290, 18 330 Z"/>
        <path class="leaf leaf-2" d="M382 330 C 392 270, 365 220, 335 205 C 345 250, 352 295, 382 330 Z"/>
        <!-- upper floor -->
        <rect class="wall" x="105" y="112" width="190" height="92" rx="3"/>
        <!-- roof -->
        <path class="roof" d="M78 120 L200 38 L322 120 Z"/>
        <path class="roof-line" d="M200 38 L200 62 M188 52 L212 52"/>
        <!-- ground floor -->
        <rect class="wall" x="82" y="204" width="236" height="116" rx="3"/>
        <rect class="band" x="82" y="198" width="236" height="10"/>
        <!-- Room 2 & Room 3 (upstairs) -->
        <rect class="window" x="126" y="134" width="52" height="46" rx="4"/>
        <rect class="window" x="222" y="134" width="52" height="46" rx="4"/>
        <path class="frame" d="M152 134 V180 M126 157 H178 M248 134 V180 M222 157 H274"/>
        <!-- Room 1 (ground, big) -->
        <rect class="window" x="104" y="232" width="98" height="56" rx="4"/>
        <path class="frame" d="M136 232 V288 M170 232 V288"/>
        <!-- door -->
        <rect class="door" x="236" y="244" width="50" height="76" rx="25"/>
        <circle class="knob" cx="276" cy="284" r="3"/>
        <!-- steps & ground -->
        <rect class="step" x="226" y="320" width="70" height="8" rx="2"/>
        <path class="ground" d="M0 330 H400"/>
        <!-- labels -->
        <text class="label" x="152" y="194" text-anchor="middle">ROOM 2</text>
        <text class="label" x="248" y="194" text-anchor="middle">ROOM 3</text>
        <text class="label" x="153" y="226" text-anchor="middle">ROOM 1</text>
      </svg>

      <div class="art-card">
        <b>4 ways to stay</b>
        <span>Whole house · or by room</span>
      </div>
    </aside>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
